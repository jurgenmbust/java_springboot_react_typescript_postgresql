name: inventory-learning
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port: only the backend can reach the database in this setup.
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BACKEND_PORT: 8081
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
    networks: [database, web]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O- http://127.0.0.1:8081/actuator/health | grep -q UP']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    networks: [web]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O- http://127.0.0.1:8080/healthz | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
networks:
  database:
    internal: true
  web:
